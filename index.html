<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F6F5C">
  <meta name="description" content="Prototipe PANTAS: Pengendalian Antibiotik Terintegrasi Apotek dan SATUSEHAT">
  <title>PANTAS | Prototipe</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='22' fill='%231F6F5C'/><rect x='28' y='44' width='44' height='12' rx='6' fill='%23fff'/><rect x='44' y='28' width='12' height='44' rx='6' fill='%23F2B24A'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage">
    <aside class="demo-panel" id="demoPanel" aria-label="Panel demo prototipe">
      <div class="demo-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>PANTAS</h1>
          <p>Pengendalian Antibiotik Terintegrasi Apotek dan SATUSEHAT</p>
        </div>
      </div>
      <p class="demo-note">Prototipe untuk Lomba Esai USK Pharmacy Fair 2026. Semua nama, kode, dan angka adalah data simulasi.</p>

      <section class="demo-group">
        <h2>Lihat sebagai</h2>
        <div class="seg" id="roleSeg" role="tablist"></div>
      </section>

      <section class="demo-group">
        <h2>Lompat ke layar</h2>
        <div class="jump-list" id="jumpList"></div>
      </section>

      <section class="demo-group">
        <h2>Skenario cepat</h2>
        <div class="jump-list" id="scenarioList"></div>
      </section>

      <button class="demo-reset" id="resetBtn" type="button">Mulai ulang simulasi</button>
    </aside>

    <button class="demo-toggle" id="demoToggle" type="button" aria-controls="demoPanel" aria-expanded="false">Panel demo</button>

    <main class="device-wrap">
      <div class="device" id="device">
        <div class="screen" id="app" aria-live="polite"></div>
      </div>
      <p class="device-caption" id="caption"></p>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/app.js"></script>
</body>
</html>
